<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Tournament - Login Amministratore</title>
    <!-- Tailwind CSS CDN for pristine styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0b0f19;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6 text-white">
        <!-- Brand Title -->
        <div class="text-center space-y-2">
            <span class="text-xs font-semibold tracking-widest text-indigo-400 uppercase">Pannello Gestione</span>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">ELITE TOURNAMENT</h1>
            <p class="text-slate-400 text-xs md:text-sm">Accedi all'area riservata per gestire il catalogo prodotti.</p>
        </div>

        <!-- Error/Success Alerts -->
        <div id="alert-box" class="hidden p-4 rounded-xl text-xs font-medium border"></div>

        <!-- Auth Form -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Indirizzo Email</label>
                <input type="email" id="email" required placeholder="admin@example.com" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-lg shadow-indigo-600/10">
                Accedi
            </button>
        </form>

        <div class="text-center">
            <a href="/index.html" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
                ← Torna al sito pubblico
            </a>
        </div>
    </div>

    <!-- Load Supabase Client SDK and Auth Module -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/admin/auth.js"></script>
    <script>
        const btnSubmit = document.getElementById('btn-submit');
        const authForm = document.getElementById('auth-form');
        const alertBox = document.getElementById('alert-box');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        function setAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
            if (type === 'error') {
                alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border-red-500/20');
            } else {
                alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
            }
            alertBox.innerText = message;
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.setAttribute('disabled', 'true');
            btnSubmit.innerText = "Elaborazione...";
            alertBox.classList.add('hidden');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                // Chiama la funzione centralizzata in auth.js
                await adminLogin(email, password);
                setAlert("Accesso effettuato! Reindirizzamento in corso...", "success");
            } catch (err) {
                setAlert(err.message || "Si è verificato un errore durante l'autenticazione.", "error");
                btnSubmit.removeAttribute('disabled');
                btnSubmit.innerText = "Accedi";
            }
        });

        // Controlla se siamo già loggati e autorizzati all'avvio
        window.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
        });
    </script>
</body>
</html>
